# Optional full MERN deployment. Persistent disks require a paid service.
# Review the plan/cost in Render before creating this service.
services:
  - type: web
    name: mahalaxmi-dudh-kendra
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /
      - key: UPLOAD_DIR
        value: uploads
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORE_LAT
        sync: false
      - key: STORE_LNG
        sync: false
      - key: APP_ORIGIN
        sync: false
